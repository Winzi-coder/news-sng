        body {

            background: #0f0f1a;
            color: white;
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .mode-selector {
            
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .mode-btn {
            padding: 12px 35px;
            border: 2px solid #333;
            background: transparent;
            color: #aaa;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .mode-btn:hover { border-color: #ffd200; color: #ffd200; transform: translateY(-2px); }
        .mode-btn.active { background: #ffd200; border-color: #ffd200; color: #1a1a2e; }
        .mode-btn.military { border-color: #ff4444; }
        .mode-btn.military:hover { border-color: #ff4444; color: #ff4444; }
        .mode-btn.military.active { background: #ff4444; border-color: #ff4444; color: #fff; }

        .mode-btn.video:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .mode-btn.video.active { background: #ff6b6b; border-color: #ff6b6b; color: #fff; }
        .language-selector {
         

            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: #222;
            border: none;
            color: #aaa;
            padding: 8px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .lang-btn.active { background: #ffd200; color: #1a1a2e; }
        .lang-btn:hover { background: #ffd200; color: #1a1a2e; }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .tab-btn {
            padding: 12px 25px;
            border: 2px solid #333;
            background: transparent;
            color: #aaa;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn:hover { border-color: #ffd200; color: #ffd200; transform: translateY(-2px); }
        .tab-btn.active { background: #ffd200; border-color: #ffd200; color: #1a1a2e; }

        .news-grid {
    
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;

    display: grid;

}

    background: rgba(255,255,255,0.07);
    border-radius: 15px;
    overflow: hidden;
    transition: 0.3s;
}

.video-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(255, 107, 107, 0.2);
}

.video-card iframe {
    width: 100%;
    height: 200px;
    border: none;
}

.video-placeholder {
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #241f2b;
    color: #ff9b9b;
    text-decoration: none;
    font-weight: 600;
}

.video-placeholder:hover {
    background: #302536;
}

.video-card .info {
    padding: 12px 15px;
}

.video-card .info h4 {
    color: #fff;
    font-size: 15px;
}

.video-card .info span {
    color: #888;
    font-size: 12px;
}

        .news-card {

        /* Модалка */

            z-index: 1000;
            justify-content: center;

            border-radius: 20px;

            display: inline-block;
            background: #ffd200;
            color: #1a1a2e;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .modal-content .source-link:hover { background: #f7c000; transform: scale(1.05); }
        .modal-close {
            position: sticky; top: 0; float: right;
            background: #ff6b6b;
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }
        .modal-close:hover { transform: rotate(90deg); background: #ff4444; }
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: #0f0f1a; border-radius: 10px; }
        .modal-content::-webkit-scrollbar-thumb { background: #ffd200; border-radius: 10px; }

        /* ===== ПОИСК ===== */
        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;

            padding: 12px 20px;

            border: 1px solid #333;
            background: #1a1a2e;
            color: #fff;
            font-size: 15px;

            .search-container { flex-direction: column; }

.load-more-btn {

        modalLink.href = article.url || '#';
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    function getFavoriteId(article) {
        return article.url || `${article.title}|${article.publishedAt}`;
    }

    function toggleFavorite(index) {
        const article = currentNews[index];
        if (!article) return;

        const favoriteId = getFavoriteId(article);
        const existingIndex = favorites.findIndex(item => item.id === favoriteId);
        if (existingIndex >= 0) {
            favorites.splice(existingIndex, 1);
        } else {
            favorites.push({ id: favoriteId, article });
        }
        localStorage.setItem('newsFavorites', JSON.stringify(favorites));
        loadNews(currentCountry, currentLang, currentMode);
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    function createCard(article, index, mode) {
        const card = document.createElement('div');
        card.className = `news-card ${mode === 'military' ? 'military-card' : ''}`;

        const titleDiv = document.createElement('h3');
        titleDiv.textContent = article.title || 'Без заголовка';

        const descP = document.createElement('p');
        descP.textContent = article.description || 'Описание отсутствует';

        const footer = document.createElement('div');
        footer.className = 'footer-card';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = `🕒 ${article.publishedAt ? new Date(article.publishedAt).toLocaleString() : ''}`;

        const sourceSpan = document.createElement('span');
        sourceSpan.className = 'source';
        sourceSpan.textContent = `📡 ${article.source?.name || 'Неизвестный источник'}`;

        const tagSpan = document.createElement('span');
        tagSpan.className = `tag ${mode === 'military' ? 'military-tag' : 'peace-tag'}`;
        tagSpan.textContent = mode === 'military' ? '⚔️ Фронт' : '🌍 Мир';

        const btn = document.createElement('button');
        btn.className = 'read-more-btn';
        btn.textContent = '📖 Читать';
        btn.dataset.index = index;
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentNews[index]) openModal(currentNews[index]);
        });

        const favBtn = document.createElement('button');
        favBtn.className = 'fav-btn';
        favBtn.textContent = favorites.some(item => item.id === getFavoriteId(article)) ? '★' : '☆';
        favBtn.title = 'Добавить в избранное';
        favBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFavorite(index);
        });

        footer.append(timeSpan, sourceSpan, tagSpan, btn, favBtn);
        card.append(titleDiv, descP, footer);
        return card;
    }

    function showLocalNews(country, mode) {
        const news = localNews[country] || localNews.ru;
        currentNews = news.map((item, index) => ({
            title: item.title,
            description: item.description,
            source: { name: item.source },
            publishedAt: new Date().toISOString(),
            url: `local:${country}:${index}`
        }));
        container.innerHTML = '';
        currentNews.forEach((article, index) => {
            const card = createCard(article, index, mode);
            container.appendChild(card);
        });
    }

    function createVideoCard(video, country = currentCountry) {
        const card = document.createElement('article');
        card.className = 'video-card';

        if (video.videoId) {
            const frame = document.createElement('iframe');
            frame.src = `https://www.youtube.com/embed/${encodeURIComponent(video.videoId)}`;
            frame.title = video.title || 'Видео новостей';
            frame.loading = 'lazy';
            frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            frame.allowFullscreen = true;
            card.appendChild(frame);
        } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'video-placeholder';
            placeholder.textContent = 'Видео временно недоступно';
            card.appendChild(placeholder);
        }

        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('h4');
        title.textContent = video.title || 'Видео новостей';
        const channel = document.createElement('span');
        channel.textContent = video.channel || 'YouTube';
        info.append(title, channel);

        const isTrusted = (channelIds[country] || []).includes(video.channelId);
        if (isTrusted) {
            const badge = document.createElement('span');
            badge.textContent = '✅ Официальный канал';
            badge.style.cssText = 'color: #4caf50; font-size: 11px; margin-left: 8px;';
            info.appendChild(badge);
        }

        card.appendChild(info);
        return card;
    }

    function showLocalVideos(country) {
        currentVideos = localVideos[country] || localVideos.ru;
        container.className = 'video-grid';
        container.innerHTML = '';
        currentVideos.forEach(video => container.appendChild(createVideoCard(video, country)));
    }

    async function loadVideosFromAPI(country, lang) {
        if (abortController) abortController.abort();

        abortController = new AbortController();
        container.className = 'video-grid';
        container.innerHTML = '<div class="loader">⏳ Загрузка видео...</div>';

        try {
            const params = new URLSearchParams({
                part: 'snippet',
                type: 'video',
                order: 'date',
                maxResults: '12',
                q: videoTerms[lang]?.[country] || videoTerms.ru.ru
            });
            const response = await fetch(`https://news-proxy-925a.onrender.com/youtube?${params}`, { signal: abortController.signal });
            const data = await response.json();

            const officialVideos = [];
            const ids = channelIds[country] || [];
            for (const id of ids) {
                const channelParams = new URLSearchParams({
                    part: 'snippet',
                    channelId: id,
                    order: 'date',
                    maxResults: '3'
                });
                const channelResponse = await fetch(`https://news-proxy-925a.onrender.com/youtube?${channelParams}`, {
                    signal: abortController.signal
                });
                const channelData = await channelResponse.json();
                if (channelData.items?.length) {
                    officialVideos.push(...channelData.items);
                }
            }

            const allVideos = [...officialVideos, ...(data.items || [])];
            const uniqueVideos = [];
            const seenIds = new Set();
            for (const item of allVideos) {
                const videoId = item.id?.videoId;
                if (videoId && !seenIds.has(videoId)) {
                    seenIds.add(videoId);
                    uniqueVideos.push(item);
                }
            }

            currentVideos = uniqueVideos
                .filter(item => item.id?.videoId)
                .map(item => ({
                    videoId: item.id.videoId,
                    title: item.snippet.title,
                    channel: item.snippet.channelTitle,
                    channelId: item.snippet.channelId
                }));

            if (!currentVideos.length) {
                showLocalVideos(country);
                return;
            }

            container.innerHTML = '';
            currentVideos.forEach(video => container.appendChild(createVideoCard(video, country)));
        } catch (error) {
            if (error.name !== 'AbortError') showLocalVideos(country);
        }
    }

    function showError(icon, title, desc) {
        container.innerHTML = `
            <div class="error">
                <span class="icon">${icon}</span>
                <div class="title">${title}</div>
                <div class="desc">${desc}</div>
            </div>
        `;
    }

    function sortNewsByDate(articles) {
        return articles.sort((a, b) => new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0));
    }

    async function loadNewsFromAPI(country, lang, mode, page = 1) {
        if (abortController) abortController.abort();
        abortController = new AbortController();

        if (page === 1) {
            container.innerHTML = '<div class="loader">⏳ Загрузка новостей...</div>';
            container.className = 'news-grid';
        }

        try {
            const terms = mode === 'peace' ? peaceTerms : militaryTerms;
            const query = terms[lang]?.[country] || terms[lang]?.ru || 'news';

            const params = new URLSearchParams({
                q: query,
                language: lang,
                sortBy: 'publishedAt',
                pageSize,
                page
            });
            const url = `https://news-proxy-925a.onrender.com/news?${params}`;

            const response = await fetch(url, { signal: abortController.signal });
            const data = await response.json();

            if (data.status === 'error' || data.totalResults === 0) {
                if (page === 1) showLocalNews(country, mode);
                return;
            }

            totalResults = data.totalResults;
            const sortedArticles = sortNewsByDate(data.articles);
            if (page === 1) {
                currentNews = sortedArticles;
                container.innerHTML = '';
            } else {
                currentNews = [...currentNews, ...sortedArticles];
            }

            const startIndex = (page - 1) * pageSize;
            const endIndex = Math.min(startIndex + pageSize, currentNews.length);
            const articlesToShow = page === 1 ? currentNews : currentNews.slice(startIndex, endIndex);

            articlesToShow.forEach((article) => {
                const index = currentNews.indexOf(article);
                const card = createCard(article, index, mode);
                container.appendChild(card);
            });

            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (currentNews.length < totalResults) {
                loadMoreBtn.style.display = 'inline-block';
                loadMoreBtn.textContent = `📰 Загрузить ещё (${currentNews.length}/${totalResults})`;
            } else {
                loadMoreBtn.style.display = 'none';
            }

        } catch (error) {
            if (error.name === 'AbortError') {
                return;
            }
            if (page === 1) showLocalNews(country, mode);
        }
    }

    function loadNews(country, lang, mode) {
        currentPage = 1;
        if (mode === 'video') {
            document.getElementById('loadMoreBtn').style.display = 'none';
            loadVideosFromAPI(country, lang);
            return;
        }

        container.className = 'news-grid';
        loadNewsFromAPI(country, lang, mode, 1);
    }

    // ===== ПОИСК ВИДЕО =====
    document.getElementById('searchBtn').addEventListener('click', function() {
        const query = document.getElementById('videoSearch').value.trim();
        if (query) {
            modeBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('.mode-btn.video').classList.add('active');
            currentMode = 'video';
            loadVideosFromSearch(query);
        }
    });

    document.getElementById('videoSearch').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('searchBtn').click();
        }
    });

    async function loadVideosFromSearch(query) {
        if (!query) return;

        if (abortController) abortController.abort();
        abortController = new AbortController();

        container.className = 'video-grid';
        container.innerHTML = '<div class="loader">🔍 Ищем видео по запросу "' + query + '"...</div>';

        try {
            const params = new URLSearchParams({
                q: query,
                maxResults: '12',
                order: 'date'
            });

            const url = `https://news-proxy-925a.onrender.com/youtube?${params}`;
            const response = await fetch(url, { signal: abortController.signal });
            const data = await response.json();

            if (!response.ok || data.error || !data.items?.length) {
                container.innerHTML = `<div class="error">❌ По запросу "${query}" ничего не найдено. Попробуйте другие ключевые слова.</div>`;
                return;
            }

            const videos = data.items
                .filter(item => item.id?.videoId)
                .map(item => ({
                    videoId: item.id.videoId,
                    title: item.snippet.title,
                    channel: item.snippet.channelTitle,
                    channelId: item.snippet.channelId
                }));

            if (!videos.length) {
                container.innerHTML = `<div class="error">❌ По запросу "${query}" ничего не найдено. Попробуйте другие ключевые слова.</div>`;
                return;
            }

            currentVideos = videos;
            container.innerHTML = '';
            videos.forEach(video => container.appendChild(createVideoCard(video, currentCountry)));
        } catch (error) {
            if (error.name !== 'AbortError') {
                container.innerHTML = '<div class="error">⚠️ Ошибка поиска. Проверьте интернет и попробуйте снова.</div>';
            }
        }
    }

    document.getElementById('loadMoreBtn').addEventListener('click', function() {
        currentPage++;
        loadNewsFromAPI(currentCountry, currentLang, currentMode, currentPage);
    });

    async function checkProxyStatus() {
        const statusEl = document.getElementById('proxyStatus');
        try {
            const response = await fetch('https://news-proxy-925a.onrender.com/news?q=test&language=ru', {
                signal: AbortSignal.timeout(5000)
            });
            if (response.ok) {
                statusEl.innerHTML = '✅ Прокси-сервер работает';
                statusEl.style.color = '#4caf50';
            } else {
                statusEl.innerHTML = '⚠️ Прокси-сервер отвечает с ошибкой';
                statusEl.style.color = '#ff9800';
            }
        } catch {
            statusEl.innerHTML = '❌ Прокси-сервер недоступен';
            statusEl.style.color = '#f44336';
        }
    }

    checkProxyStatus();

    // ===== ОБРАБОТЧИКИ =====

    modeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            modeBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.dataset.mode;
            loadNews(currentCountry, currentLang, currentMode);
        });
    });

    countryBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            countryBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCountry = this.dataset.country;
            loadNews(currentCountry, currentLang, currentMode);
        });
    });

    langBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            langBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentLang = this.dataset.lang;
            loadNews(currentCountry, currentLang, currentMode);
        });
    });

    // Запуск
    loadNews(currentCountry, currentLang, currentMode);
</script>
